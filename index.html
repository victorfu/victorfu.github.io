<!DOCTYPE html>
<html lang="en">

<head>
    <title>Victor Fu</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Victor Fu, Engineer, Entrepreneur, VP of Engineering" />
    <meta name="description"
        content="Victor Fu — Building products, leading teams, and raising a daughter I adore." />
    <meta name="robots" content="index,follow" />
    <meta name="application-name" content="Victor Fu" />
    <meta name="apple-mobile-web-app-title" content="Victor Fu" />
    <meta name="summary" content="Engineer, Entrepreneur, VP of Engineering, Dad" />

    <!-- Favicon -->
    <link rel="icon" href="assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <!-- Apple -->
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    <!-- Manifest -->
    <link rel="manifest" href="assets/images/site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 3rem clamp(1.5rem, 7vw, 7rem);
            color: #272921;
            background: #faf8f1;
            font-family: Inter, system-ui, sans-serif;
        }

        main {
            width: min(100%, 56rem);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(11rem, 32%);
            align-items: center;
            gap: clamp(2rem, 6vw, 5rem);
        }

        .portrait {
            grid-column: 2;
            grid-row: 1;
            width: 100%;
            height: auto;
            padding: 8%;
            box-sizing: border-box;
            border-radius: 50%;
            background: #eeeadd;
        }

        .intro { grid-area: 1 / 1; }

        h1 {
            margin: 0;
            font-family: Baskerville, "Iowan Old Style", Georgia, serif;
            font-size: clamp(4rem, 8vw, 7rem);
            font-weight: 400;
            letter-spacing: -0.055em;
            line-height: 1.04;
        }

        p {
            margin: 1.4rem 0 0;
            font-size: clamp(1.06rem, 1.7vw, 1.3rem);
            line-height: 1.65;
            color: #505249;
        }

        .personal { display: block; }

        nav {
            display: flex;
            gap: 1.8rem;
            margin-top: 1.6rem;
        }

        nav a {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            min-height: 44px;
            color: #315849;
            font-weight: 500;
            text-decoration: underline;
            text-decoration-color: #99ab99;
            text-underline-offset: 0.32em;
        }

        nav a:hover { text-decoration-color: currentColor; }
        nav a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }

        @media (max-width: 40rem) {
            main {
                grid-template-columns: minmax(0, 1fr);
                gap: 1.8rem;
            }

            .portrait {
                grid-area: auto;
                width: 8rem;
                padding: 0.7rem;
            }

            .intro { grid-area: auto; }
            p { max-width: 28ch; }
            .personal { display: inline; }
        }
    </style>
</head>

<body>
    <main>
        <img src="logo.png" alt="" width="640" height="640" class="portrait">
        <div class="intro">
            <h1>Victor Fu</h1>
            <p>Building products, leading teams, <span class="personal">and raising a daughter I adore.</span></p>
            <nav aria-label="Contact">
                <a href="https://github.com/victorfu" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a>
                <a href="mailto:supergothere@gmail.com">Email <span aria-hidden="true">↗</span></a>
            </nav>
        </div>
    </main>
</body>

</html>
