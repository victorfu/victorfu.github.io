<!DOCTYPE html>
<html lang="en">

<head>
    <title>Victor Fu</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Victor Fu, Engineer, Entrepreneur, VP of Engineering" />
    <meta name="description"
        content="Victor Fu — Building products, leading teams, and raising a daughter I adore." />
    <meta name="robots" content="index,follow" />
    <meta name="application-name" content="Victor Fu" />
    <meta name="apple-mobile-web-app-title" content="Victor Fu" />
    <meta name="summary" content="Engineer, Entrepreneur, VP of Engineering, Dad" />

    <!-- Favicon -->
    <link rel="icon" href="assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <!-- Apple -->
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
    <!-- Manifest -->
    <link rel="manifest" href="assets/images/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,144,550;1,36,400&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 4rem clamp(1.25rem, 7vw, 6rem);
            color: #242921;
            background: #faf8f1;
            font-family: Inter, system-ui, sans-serif;
        }

        main {
            width: min(100%, 54rem);
        }

        .signature {
            display: flex;
            align-items: flex-start;
            gap: 0.08em;
            font-size: clamp(2.75rem, 11vw, 9.5rem);
        }

        h1 {
            margin: 0;
            font-family: Fraunces, Georgia, serif;
            font-size: inherit;
            font-weight: 550;
            letter-spacing: -0.045em;
            line-height: 1;
        }

        .portrait {
            width: 0.78em;
            height: auto;
            transform: translateY(-18%) rotate(8deg);
        }

        p {
            margin: clamp(1.8rem, 4vw, 3rem) 0 0;
            font-size: clamp(1rem, 2vw, 1.35rem);
            line-height: 1.6;
            color: #4d5148;
        }

        .personal {
            display: block;
            font-family: Fraunces, Georgia, serif;
            font-size: clamp(1.45rem, 3.3vw, 2.55rem);
            font-style: italic;
            line-height: 1.3;
            color: #374637;
        }

        nav {
            display: flex;
            gap: 1.8rem;
            margin-top: clamp(2rem, 5vw, 3.75rem);
        }

        nav a {
            display: inline-flex;
            align-items: center;
            gap: 0.35em;
            min-height: 44px;
            font-size: 0.94rem;
            font-weight: 500;
            color: #315849;
            text-decoration-color: #99ab99;
            text-underline-offset: 0.32em;
        }

        nav a:hover { text-decoration-color: currentColor; }
        nav a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }

        @media (max-width: 34rem) {
            .signature { font-size: clamp(2.75rem, 14vw, 4.75rem); }
        }
    </style>
</head>

<body>
    <main>
        <div class="signature">
            <h1>Victor Fu</h1>
            <img src="logo.png" alt="" width="640" height="640" class="portrait">
        </div>
        <p>Building products, leading teams, <span class="personal">and raising a daughter I adore.</span></p>
        <nav aria-label="Contact">
            <a href="https://github.com/victorfu" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a>
            <a href="mailto:supergothere@gmail.com">Email <span aria-hidden="true">↗</span></a>
        </nav>
    </main>
</body>

</html>
